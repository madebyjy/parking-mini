<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="주차기록"><title>주차기록</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#202b39;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:450px;margin:auto;padding:20px 12px 40px}header{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 18px}h1{margin:0;font-size:28px;text-align:center}header small{display:block;text-align:center;color:#8490a1;font-size:11px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.25;cursor:default}.nav{border:1px solid #e3e9f1;background:white;border-radius:11px;width:40px;height:38px;font-size:22px}.cars{display:flex;justify-content:center;gap:4px;margin:0 auto 20px;padding:4px;background:#e8edf4;border-radius:13px;width:max-content}.cars button{border:0;border-radius:10px;background:transparent;padding:10px 16px;font-weight:700;color:#738094}.cars button.active{background:white;color:#243247;box-shadow:0 1px 5px #0001}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.col{background:white;border:1px solid #e7ebf1;border-radius:16px;padding:12px 8px;min-height:380px;text-align:center}.place{font-size:29px;height:42px;display:grid;place-items:center}.count{font-size:19px;font-weight:800;margin:5px 0 12px}.actions{display:flex;gap:5px;margin-bottom:12px}.actions button{width:50%;border:0;border-radius:9px;height:39px;font-size:22px;font-weight:700}.minus{background:#eef1f5;color:#667080}.plus{background:#34475f;color:white}.dates{display:flex;flex-direction:column;gap:6px}.tile{height:34px;border-radius:8px;border:1px solid #e8edf3;background:#fafbfc;display:grid;place-items:center;font-weight:700}.tile.filled.home{background:#fff0f3;border-color:#f1afbd;color:#e85a72}.tile.filled.office{background:#eaf6ff;border-color:#a9d9fc;color:#238fdf}.tile.filled.subway{background:#e8f9f0;border-color:#a9e5ca;color:#1fa371}.hint{text-align:center;font-size:12px;color:#8793a3;line-height:1.7;margin:18px 0 10px}.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer button{border:0;background:none;color:#718095;font-size:12px;padding:7px}dialog{border:0;border-radius:18px;padding:20px;width:min(90vw,350px);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#19283a88}dialog h2{font-size:19px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select{width:100%;font:inherit;padding:11px;border:1px solid #d9e0e8;border-radius:9px;background:white}.dialogActions{display:flex;gap:8px;margin-top:20px}.dialogActions button{border:0;border-radius:9px;padding:12px;flex:1;font-weight:700}.save{background:#34475f;color:white}.danger{background:#fff0f1;color:#c73950}.cancel{background:#eef1f5;color:#536071}
</style></head><body><main><header><button class="nav" id="prev" aria-label="지난달">‹</button><div><h1 id="month"></h1><small id="year"></small></div><button class="nav" id="next" aria-label="다음달">›</button></header><div class="cars"><button data-car="mine" class="active">🚙 내 차</button><button data-car="husband">🚗 남편차</button></div><div class="cols" id="cols"></div><p class="hint">+ 오늘 날짜 기록 · − 마지막 기록 취소<br>날짜 칸을 누르면 수정·삭제할 수 있어요.</p><div class="footer"><button id="backup">백업 저장</button><button id="restore">백업 복원</button></div><input type="file" id="file" accept="application/json" hidden></main>
<dialog id="edit"><h2>주차 기록 수정</h2><label for="date">날짜</label><input type="date" id="date"><label for="place">장소</label><select id="place"><option value="home">민재네</option><option value="office">회사</option><option value="subway">지하철</option></select><label for="editcar">차량</label><select id="editcar"><option value="mine">🚙 내 차</option><option value="husband">🚗 남편차</option></select><div class="dialogActions"><button class="danger" id="delete">삭제</button><button class="cancel" id="cancel">취소</button><button class="save" id="save">저장</button></div></dialog>
<script>
(()=>{'use strict';
const KEY='parking-mini-v1',P=[['home','🏠'],['office','🏢'],['subway','🚇']],valid=x=>x&&Number.isFinite(x.id)&&['mine','husband'].includes(x.car)&&P.some(p=>p[0]===x.place)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date);
const localDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monthOf=d=>localDate(d).slice(0,7),prevMonth=()=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return monthOf(d)},currentMonth=()=>monthOf(new Date());
let month=currentMonth(),car='mine',entries=[],editing=null;
try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))entries=a.filter(valid)}catch{}
const $=id=>document.getElementById(id);
function persist(){entries=entries.filter(x=>valid(x)&&[currentMonth(),prevMonth()].includes(x.date.slice(0,7)));try{localStorage.setItem(KEY,JSON.stringify(entries))}catch{alert('기록을 저장하지 못했습니다. Safari 저장 공간을 확인해주세요.')}render()}
function list(place){return entries.filter(x=>x.car===car&&x.place===place&&x.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function render(){const [y,m]=month.split('-');$('month').textContent=Number(m)+'월';$('year').textContent=y+'년';$('prev').disabled=month<=prevMonth();$('next').disabled=month>=currentMonth();document.querySelectorAll('[data-car]').forEach(b=>b.classList.toggle('active',b.dataset.car===car));$('cols').replaceChildren();
for(const [place,emoji] of P){const a=list(place),c=document.createElement('section');c.className='col';c.innerHTML='<div class="place"></div><div class="count"></div><div class="actions"><button class="minus" aria-label="마지막 기록 취소">−</button><button class="plus" aria-label="오늘 기록 추가">+</button></div><div class="dates"></div>';c.querySelector('.place').textContent=emoji;c.querySelector('.count').textContent=a.length+'회';const minus=c.querySelector('.minus'),plus=c.querySelector('.plus');minus.disabled=month!==currentMonth()||!a.length;plus.disabled=month!==currentMonth();plus.onclick=()=>{entries.push({id:Date.now()+Math.random(),car,place,date:localDate(new Date())});persist()};minus.onclick=()=>{if(confirm('가장 최근 기록을 삭제할까요?')){entries=entries.filter(x=>x.id!==a[a.length-1].id);persist()}};const box=c.querySelector('.dates');for(let i=0;i<Math.max(6,a.length);i++){const b=document.createElement('button');b.className='tile'+(a[i]?' filled '+place:'');if(a[i]){b.textContent=Number(a[i].date.slice(8));b.onclick=()=>openEdit(a[i])}else{b.disabled=true;b.setAttribute('aria-hidden','true')}box.append(b)}$('cols').append(c)}}
function openEdit(x){editing=x.id;$('date').value=x.date;$('date').min=month+'-01';$('date').max=month+'-'+new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();$('place').value=x.place;$('editcar').value=x.car;$('edit').showModal()}
document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{car=b.dataset.car;render()});
$('prev').onclick=()=>{month=prevMonth();render()};$('next').onclick=()=>{month=currentMonth();render()};
$('cancel').onclick=()=>$('edit').close();
$('save').onclick=()=>{if(!$('date').value.startsWith(month)){alert('조회 중인 달의 날짜만 선택해주세요.');return}entries=entries.map(x=>x.id===editing?{...x,date:$('date').value,place:$('place').value,car:$('editcar').value}:x);$('edit').close();persist()};
$('delete').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){entries=entries.filter(x=>x.id!==editing);$('edit').close();persist()}};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='parking-backup-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!Array.isArray(obj.entries)||!obj.entries.every(valid))throw Error();if(confirm('현재 기록을 백업 파일의 기록으로 바꿀까요?')){entries=obj.entries;persist();alert('복원 완료')}}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(![currentMonth(),prevMonth()].includes(month))month=currentMonth();persist()}});persist();
})();
</script></body></html>
